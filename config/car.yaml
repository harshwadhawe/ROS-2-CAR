# Single config for every node on the car. Add a block per new sensor.

actuator_node:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 0x40
    pwm_frequency: 60
    # Copy these from your DonkeyCar myconfig.py (same 12-bit tick units)
    steering_channel: 14
    throttle_channel: 1
    steering_left_pwm: 470
    steering_right_pwm: 320
    throttle_forward_pwm: 460
    throttle_stopped_pwm: 400
    throttle_reverse_pwm: 340
    max_steering_angle: 0.4    # rad at full lock
    max_speed: 2.0             # m/s mapped to full forward PWM
    throttle_limit: 0.3        # hard safety cap, fraction of full throttle
    watchdog_timeout: 0.25     # s without /cmd before going neutral

joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    # Republish steadily so a quiet pad is distinguishable from a dropped one.
    # teleop_joy's joy_timeout is meaningless if this is 0.0.
    autorepeat_rate: 20.0

teleop_joy:
  ros__parameters:
    steer_axis: 0
    throttle_axis: 4
    steer_scale: -1.0
    throttle_scale: 1.0
    max_speed: 1.0
    max_steering_angle: 0.4
    publish_rate: 20.0
    joy_timeout: 0.5

camera:
  ros__parameters:
    # csi_camera on the OV5647 ribbon cam. Sensor auto exposure, gain and
    # white balance; set auto_exposure false to use the manual pair below.
    width: 160
    height: 120
    fps: 20.0                # set on the sensor (vertical blanking), 1-62
    auto_exposure: true
    analogue_gain: 128       # 16-1023, manual only
    exposure: 500            # 4-500 lines, manual only
    frame_id: camera_link

lane_follower:
  ros__parameters:
    speed: 0.3               # m/s, open-loop: drops as the pack drains
    # From camera_setup (same car and track): 450 mm was the pure-pursuit
    # lookahead there; 0.264 m reproduces its measured CURV_PER_STEER of
    # 1.603 1/m per unit steering at our 0.4 rad lock (tan(0.4)/1.603).
    lookahead_distance: 0.45 # m
    band: 0.1                # m either side of the lookahead arc
    wheelbase: 0.264         # m, effective
    # Height and tilt as estimated on the car (170 mm, 10-15 deg); hfov is
    # still a guess. Check: a mark on the floor 0.45 m ahead should sit on the
    # green arc in /lane_follower/debug -- nudge cam_pitch_deg until it does.
    cam_height: 0.17         # m, lens above floor
    cam_pitch_deg: 12.5      # tilt down from horizontal, middle of 10-15
    cam_hfov_deg: 60.0       # lens horizontal field of view
    # Black track on beige carpet: V histogram has road at 20-60, beige at
    # 220+, almost nothing between. Grey carpet is dark too; connectivity to
    # the floor ahead of the car excludes it, not this threshold.
    road_v_max: 100          # HSV value <= this is dark
    min_pixels: 30           # fewer road pixels on the arc = lost, stop

