# Single config for every node on the car. Add a block per new sensor.

actuator_node:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 0x40
    pwm_frequency: 60
    # Copy these from your DonkeyCar myconfig.py (same 12-bit tick units)
    steering_channel: 14
    throttle_channel: 1
    steering_left_pwm: 470
    steering_right_pwm: 320
    throttle_forward_pwm: 460
    throttle_stopped_pwm: 400
    throttle_reverse_pwm: 340
    max_steering_angle: 0.4    # rad at full lock
    max_speed: 2.0             # m/s mapped to full forward PWM
    throttle_limit: 0.3        # hard safety cap, fraction of full throttle
    watchdog_timeout: 0.25     # s without /cmd before going neutral

joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    # Republish steadily so a quiet pad is distinguishable from a dropped one.
    # teleop_joy's joy_timeout is meaningless if this is 0.0.
    autorepeat_rate: 20.0

teleop_joy:
  ros__parameters:
    steer_axis: 0
    throttle_axis: 4
    steer_scale: -1.0
    throttle_scale: 1.0
    max_speed: 1.0
    max_steering_angle: 0.4
    publish_rate: 20.0
    joy_timeout: 0.5

camera:
  ros__parameters:
    # csi_camera on the OV5647 ribbon cam. No auto exposure: tune these to
    # the track lighting until the tape is clearly yellow in the debug image.
    width: 160
    height: 120
    analogue_gain: 400       # 16-1023
    exposure: 500            # 4-500
    frame_id: camera_link

lane_follower:
  ros__parameters:
    speed: 0.3               # m/s; actuator throttle_limit still caps it
    lookahead_distance: 0.5  # m; longer = smoother, cuts corners more
    # Measure these on the car -- the ground projection is only as good as
    # they are. Check: a tape mark 0.5 m ahead should land at the debug
    # image's target when lookahead_distance is 0.5.
    wheelbase: 0.26          # m, front axle to rear axle
    cam_height: 0.15         # m, lens above floor
    cam_pitch_deg: 20.0      # tilt down from horizontal
    cam_hfov_deg: 60.0       # webcam horizontal field of view
    lane_width: 0.5          # m between the inner edges of the yellow tape
    min_path_points: 3
    hsv_low: [20, 80, 80]    # yellow; check the mask on the debug image
    hsv_high: [40, 255, 255]

